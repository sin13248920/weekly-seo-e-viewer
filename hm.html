<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해킹범의 메시지^^</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f4f4f4;
}

.viewer-wrapper {
  display: flex;
  justify-content: center;
  padding: 20px;
}

.viewer-card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  max-width: 1100px;
  width: 100%;
  overflow: hidden;

  position: relative;
}

/* PDF 영역 */
.page-container {
  display: flex;
  justify-content: center;
  gap: 10px;
  transform-origin: center center;
  touch-action: none;
  position: relative;
  z-index: 1;
}

canvas {
  width: 100%;
  max-width: 48%;
  background: #fff;
  border-radius: 8px;
}

/* 컨트롤 */
.controls {
  text-align: center;
  margin-top: 12px;
  position: relative;
  z-index: 10;
  padding-top: 10px;
}

.controls button {
  margin: 5px;
  padding: 8px 14px;
  border: none;
  background: #eee;
  border-radius: 6px;
  cursor: pointer;
}

#zoomControls {
  margin-top: 10px;
  display: none;
}

/* 로딩 */
#loading {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
  z-index: 999;
}

.viewer-card.loading {
  pointer-events: none;
  user-select: none;
}

@media (max-width: 768px) {
  .page-container {
    flex-direction: column;
  }
  canvas {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<div id="header"></div>

<div class="viewer-wrapper">
  <div class="viewer-card loading" id="viewerCard">

    <div id="loading">PDF 로딩중...</div>

    <div class="page-container" id="pageContainer">
      <canvas id="leftCanvas"></canvas>
      <canvas id="rightCanvas"></canvas>
    </div>

    <div class="controls">

      <div id="navButtons">
        <button onclick="prevPage()">◀ 이전</button>
        <span id="pageInfo"></span>
        <button onclick="nextPage()">다음 ▶</button>
      </div>

      <br>

      <button id="zoomBtn" onclick="enableZoom()">🔍 돋보기</button>
      <button id="resetBtn" onclick="disableZoom()" style="display:none;">❌ 원래대로</button>

      <div id="zoomControls">
        <button onclick="zoomIn()">➕ 확대</button>
        <button onclick="zoomOut()">➖ 축소</button>
      </div>

    </div>

  </div>
</div>

<div id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
fetch("components/header.html").then(r=>r.text()).then(d=>header.innerHTML=d);
fetch("components/footer.html").then(r=>r.text()).then(d=>footer.innerHTML=d);

/* =========================
   🔥 DOM 연결 (필수 보강)
========================= */
const pageContainer = document.getElementById("pageContainer");
const leftCanvas = document.getElementById("leftCanvas");
const rightCanvas = document.getElementById("rightCanvas");
const zoomBtn = document.getElementById("zoomBtn");
const resetBtn = document.getElementById("resetBtn");
const navButtons = document.getElementById("navButtons");
const zoomControls = document.getElementById("zoomControls");
const pageInfo = document.getElementById("pageInfo");
const viewerCard = document.getElementById("viewerCard");
const loadingEl = document.getElementById("loading");

const url = "https://raw.githubusercontent.com/sin13248920/weekly-seo-viewer/main/components/message.pdf";

let pdfDoc = null;
let currentPage = 1;
let zoomMode = false;

let scale = 1;
let x = 0, y = 0;

/* 로딩 */
pdfjsLib.getDocument(url).promise.then(pdf => {
  pdfDoc = pdf;

  loadingEl.style.display = "none";
  viewerCard.classList.remove("loading");

  renderPages();
});

/* 렌더 */
function renderPages() {
  if (window.innerWidth < 768) renderSingle(currentPage);
  else currentPage === 1 ? renderSingle(1) : renderDouble(currentPage, currentPage + 1);
}

function renderSingle(n) {
  rightCanvas.style.display = "none";
  renderPage(n, leftCanvas);
  pageInfo.textContent = `${n} / ${pdfDoc.numPages}`;
}

function renderDouble(l, r) {
  rightCanvas.style.display = "block";
  renderPage(l, leftCanvas);
  if (r <= pdfDoc.numPages) renderPage(r, rightCanvas);
  pageInfo.textContent = `${l}-${Math.min(r, pdfDoc.numPages)} / ${pdfDoc.numPages}`;
}

function renderPage(n, canvas) {
  pdfDoc.getPage(n).then(page => {
    const ctx = canvas.getContext("2d");
    const viewport = page.getViewport({ scale: 1.5 });

    canvas.height = viewport.height;
    canvas.width = viewport.width;

    page.render({ canvasContext: ctx, viewport });
  });
}

/* 페이지 이동 */
function nextPage() {
  if (zoomMode) return;

  if (window.innerWidth < 768) currentPage++;
  else currentPage = (currentPage === 1) ? 2 : currentPage + 2;

  if (currentPage > pdfDoc.numPages) return;
  renderPages();
}

function prevPage() {
  if (zoomMode) return;

  if (window.innerWidth < 768) currentPage--;
  else currentPage = (currentPage === 2) ? 1 : currentPage - 2;

  if (currentPage < 1) currentPage = 1;
  renderPages();
}

/* =========================
   🔍 줌 모드
========================= */
function enableZoom() {
  zoomMode = true;

  zoomBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
  navButtons.style.display = "none";
  zoomControls.style.display = "block";
}

function disableZoom() {
  zoomMode = false;

  zoomBtn.style.display = "inline-block";
  resetBtn.style.display = "none";
  navButtons.style.display = "block";
  zoomControls.style.display = "none";

  scale = 1;
  x = 0;
  y = 0;
  updateTransform();
}

function zoomIn() {
  if (!zoomMode) return;
  scale = Math.min(scale + 0.2, 3);
  updateTransform();
}

function zoomOut() {
  if (!zoomMode) return;
  scale = Math.max(scale - 0.2, 1);
  updateTransform();
}

function updateTransform() {
  pageContainer.style.transform =
    `translate(${x}px, ${y}px) scale(${scale})`;
}

/* =========================
   🖱 PC 드래그
========================= */
let isMouseDown = false;
let startX = 0, startY = 0;

pageContainer.addEventListener("mousedown", e => {
  if (!zoomMode) return;

  isMouseDown = true;
  startX = e.clientX - x;
  startY = e.clientY - y;
});

window.addEventListener("mousemove", e => {
  if (!zoomMode || !isMouseDown) return;

  x = e.clientX - startX;
  y = e.clientY - startY;
  updateTransform();
});

window.addEventListener("mouseup", () => {
  isMouseDown = false;
});

/* =========================
   📱 모바일 (수정 핵심)
========================= */
let lastDistance = null;
let initialScale = 1;
let isDragging = false;
let touchStartX = 0;
let touchStartY = 0;

pageContainer.addEventListener("touchstart", e => {
  if (!zoomMode) return;

  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastDistance = Math.sqrt(dx * dx + dy * dy);
    initialScale = scale;
  }

  if (e.touches.length === 1) {
    isDragging = true;
    touchStartX = e.touches[0].clientX - x;
    touchStartY = e.touches[0].clientY - y;
  }
});

pageContainer.addEventListener("touchmove", e => {
  if (!zoomMode) return;

  if (e.touches.length === 2 && lastDistance) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    const ratio = distance / lastDistance;
    scale = Math.max(1, Math.min(3, initialScale * ratio));

    updateTransform();
  }

  if (e.touches.length === 1 && isDragging) {
    x = e.touches[0].clientX - touchStartX;
    y = e.touches[0].clientY - touchStartY;
    updateTransform();
  }
});

pageContainer.addEventListener("touchend", () => {
  lastDistance = null;
  isDragging = false;
});
</script>

</body>
</html>
