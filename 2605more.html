<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 월간00 전체보기</title>

<style>
html, body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #ffffff; /* 🔥 완전 흰색 */
  color: #111;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 콘텐츠 영역 */
.content {
  flex: 1;
}

/* 상단 타이틀 */
.header-title {
  padding: 25px 20px 10px;
  font-size: 22px;
  font-weight: 600;
}

/* 🔥 타일 그리드 */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 24px;
  padding: 20px;
}

/* 카드 */
.card {
  cursor: pointer;
}

.thumb {
  width: 100%;
  height: 180px;
  border-radius: 10px;
  object-fit: cover;
  background: #444;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover .thumb {
  transform: scale(1.05);
  box-shadow: 0 6px 18px rgba(0,0,0,0.2);
}

.card p {
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
}

/* 모바일에서도 자연스럽게 */
@media (max-width: 480px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <div id="header"></div>

  <!-- CONTENT -->
  <div class="content">

    <div class="header-title">2026년 월간00</div>

    <div class="grid">

      <div class="card" onclick="location.href='202605.html'">
        <img class="thumb"
        src="https://drive.google.com/thumbnail?id=1hk7NpBIfWI06E5XDO2oZi5J0ZSnydCk5&sz=w1000">
        <p>2026년 5월호</p>
      </div>

      <div class="card" onclick="location.href='202606.html'">
        <img class="thumb"
        src="https://drive.google.com/thumbnail?id=1OSbIGt3ZwVDYecxrVhHrB_v8R-oVirsd&sz=w1000">
        <p>2026년 6월호</p>
      </div>

      <!-- 계속 추가 가능 -->

    </div>

  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

</div>

<script>
/* 헤더 / 푸터 불러오기 */
fetch("components/header.html")
  .then(r => r.text())
  .then(d => document.getElementById("header").innerHTML = d);

fetch("components/footer.html")
  .then(r => r.text())
  .then(d => document.getElementById("footer").innerHTML = d);
</script>

</body>
</html>
