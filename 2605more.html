<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>월간서오 e뷰어</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI","Noto Sans KR",sans-serif;
    background:#fff;
    color:#111;
}

.container{
    max-width:1100px;
    margin:0 auto;
    padding:20px;
}

/* =========================
   HEADER AREA
========================= */

.top{
    border-bottom:1px solid #ddd;
    padding-bottom:15px;
    margin-bottom:20px;
}

.title{
    font-size:20px;
    font-weight:700;
}

.sub{
    font-size:12px;
    color:#666;
    margin-top:6px;
}

/* =========================
   GRID LIST
========================= */

.grid{
    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));

    gap:14px;
}

/* 카드 */

.card{
    border:1px solid #ccc;

    cursor:pointer;

    transition:0.1s;
}

.card:hover{
    background:#f7f7f7;
}

.card img{
    width:100%;
    height:240px;

    object-fit:cover;

    border-bottom:1px solid #ccc;
}

.card-body{
    padding:10px;
}

.card-title{
    font-size:13px;
    font-weight:700;
}

.card-desc{
    font-size:11px;
    color:#666;
    margin-top:4px;
}

/* =========================
   BACK BUTTON
========================= */

.back{
    display:inline-block;

    margin-top:20px;

    font-size:13px;

    cursor:pointer;

    color:#000;
}

.back:hover{
    text-decoration:underline;
}

/* =========================
   MOBILE
========================= */

@media (max-width:768px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="top">

        <div class="title">
            2026년
        </div>

        <div class="sub">
            2026년에 발간한 월간서오들입니다.
        </div>

    </div>

    <div class="grid">

        <div class="card" onclick="location.href='202605.html'">

            <img src="https://drive.google.com/thumbnail?id=1hk7NpBIfWI06E5XDO2oZi5J0ZSnydCk5&sz=w1000">

            <div class="card-body">
                <div class="card-title">2026년 5월호</div>
                <div class="card-desc">최신호</div>
            </div>

        </div>

        <div class="card" onclick="location.href='202606.html'">

            <img src="https://drive.google.com/thumbnail?id=1OSbIGt3ZwVDYecxrVhHrB_v8R-oVirsd&sz=w1000">

            <div class="card-body">
                <div class="card-title">2026년 6월호</div>
                <div class="card-desc">발행 예정</div>
            </div>

        </div>

    </div>

    <div class="back" onclick="location.href='index.html'">
        < 메인으로 돌아가기
    </div>

</div>

</body>
</html>
