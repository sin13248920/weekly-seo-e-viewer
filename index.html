<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월간서오 e뷰어</title>

<style>
html, body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #fff;
  color: #111;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 공통 섹션 */
.section {
  padding: 30px 20px;
}

/* 제목 (통일) */
.section-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 15px;
}

/* =========================
   최신호
========================= */
.latest-box {
  background: #eee;
  border-radius: 12px;
  padding: 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.latest-info {
  flex: 1;
  text-align: center;
}

.latest-info h2 {
  margin: 0;
  font-size: 28px;
  font-weight: 600;
}

.latest-info p {
  margin: 12px 0 20px;
  color: #222;
}

.latest-info button {
  padding: 10px 18px;
  border: none;
  border-radius: 6px;
  background: white;
  cursor: pointer;
  font-weight: 500;
  transition: 0.2s;
}

.latest-info button:hover {
  background: #ddd;
}

.latest-cover {
  width: 140px;
  height: 190px;
  object-fit: cover;
  border-radius: 6px;
  background: #444;
}

/* =========================
   리스트 영역
========================= */
.list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.more {
  font-size: 14px;
  cursor: pointer;
}

/* 🔥 핵심: 가로 스크롤 */
.list {
  display: flex;
  gap: 20px;
  margin-top: 15px;

  overflow-x: auto;
  padding-bottom: 10px;

  scroll-snap-type: x mandatory;
}

/* 스크롤바 살짝 숨김 */
.list::-webkit-scrollbar {
  height: 6px;
}
.list::-webkit-scrollbar-thumb {
  background: #ccc;
  border-radius: 10px;
}

/* 카드 */
.item {
  min-width: 140px;
  flex-shrink: 0;
  cursor: pointer;
  scroll-snap-align: start;
}

.thumb {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
  background: #444;
  transition: transform 0.2s;
}

.item:hover .thumb {
  transform: scale(1.05);
}

.item p {
  text-align: center;
  margin-top: 8px;
  font-size: 14px;
}

/* =========================
   모바일에서도 동일 유지
========================= */
@media (max-width: 768px) {

  .latest-box {
    flex-direction: row; /* ❗ 세로로 안 바꿈 */
  }

  .latest-info h2 {
    font-size: 22px;
  }

  .latest-cover {
    width: 110px;
    height: 150px;
  }

}
</style>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <div id="header"></div>

  <div class="content">

    <!-- 최신호 -->
    <div class="section">
      <div class="section-title">최신호</div>

      <div class="latest-box">
        <div class="latest-info">
          <h2>2026년 5월호</h2>
          <p>간단한 설명</p>
          <button onclick="location.href='202605.html'">보러 가기</button>
        </div>

        <img class="latest-cover"
        src="https://drive.google.com/thumbnail?id=1hk7NpBIfWI06E5XDO2oZi5J0ZSnydCk5&sz=w1000">
      </div>
    </div>

    <!-- 리스트 -->
    <div class="section">

      <div class="list-header">
        <div class="section-title">2026년 월간00</div>
        <div class="more">더보기 →</div>
      </div>

      <div class="list">

        <div class="item" onclick="location.href='202605.html'">
          <img class="thumb"
          src="https://drive.google.com/thumbnail?id=1hk7NpBIfWI06E5XDO2oZi5J0ZSnydCk5&sz=w1000">
          <p>2026년 5월호</p>
        </div>

        <div class="item" onclick="location.href='202606.html'">
          <img class="thumb"
          src="https://drive.google.com/thumbnail?id=1OSbIGt3ZwVDYecxrVhHrB_v8R-oVirsd&sz=w1000">
          <p>2026년 6월호</p>
        </div>

      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

</div>

<script>
/* 헤더 / 푸터 */
fetch("components/header.html")
  .then(r => r.text())
  .then(d => document.getElementById("header").innerHTML = d);

fetch("components/footer.html")
  .then(r => r.text())
  .then(d => document.getElementById("footer").innerHTML = d);
</script>

</body>
</html>
