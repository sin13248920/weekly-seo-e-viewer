<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>월간서오 e뷰어</title>

<style>

/* =========================
   기본
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI","Noto Sans KR",sans-serif;
    background:#fff;
    color:#111;
}

/* 전체 컨테이너 */
.container{
    max-width:1200px;
    margin:0 auto;
    padding:20px;
}

/* =========================
   HEADER / FOOTER 영역
========================= */

#header, #footer{
    width:100%;
}

/* =========================
   HERO (최신호)
========================= */

.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:25px 0;

    border-bottom:1px solid #ddd;
}

/* 텍스트 영역 */
.hero-text{
    max-width:600px;
}

/* 최신호 라벨 */
.section-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:8px;
}

/* 메인 제목 */
.hero-title{
    font-size:30px;
    font-weight:700;
}

/* 설명 */
.hero-desc{
    margin-top:10px;
    font-size:13px;
    color:#555;
    line-height:1.6;
}

/* 버튼 */
.hero-btn{
    display:inline-block;

    margin-top:15px;

    padding:8px 14px;

    font-size:13px;

    border:1px solid #333;

    background:#fff;

    cursor:pointer;
}

.hero-btn:hover{
    background:#f2f2f2;
}

/* =========================
   표지 이미지 (핵심 수정)
========================= */

.hero-img{
    width:180px;

    height:auto;
    max-height:260px;

    object-fit:contain;

    border:1px solid #ccc;

    background:#fff;
}

/* =========================
   아카이브 타이틀
========================= */

.section{
    margin-top:25px;
}

/* 링크형 타이틀 */
.section-link{
    font-size:18px;
    font-weight:700;

    color:#000;

    cursor:pointer;

    display:inline-block;

    margin-bottom:12px;
}

.section-link:hover{
    text-decoration:underline;
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(160px,1fr));

    gap:12px;
}

/* 카드 */

.card{
    border:1px solid #ccc;

    background:#fff;

    cursor:pointer;
}

.card:hover{
    background:#f9f9f9;
}

.card img{
    width:100%;
    height:200px;

    object-fit:cover;

    border-bottom:1px solid #ccc;
}

.card-body{
    padding:8px;
}

.card-title{
    font-size:13px;
    font-weight:700;
}

.card-desc{
    font-size:11px;
    color:#666;
    margin-top:4px;
}

/* =========================
   FOOTER
========================= */

footer{
    margin-top:40px;

    padding-top:15px;

    border-top:1px solid #ddd;

    font-size:11px;
    color:#777;

    text-align:center;
}

/* =========================
   PC 보정 (이미지 추가 안정)
========================= */

@media (min-width:1024px){

    .hero-img{
        width:200px;
        max-height:320px;
        object-fit:contain;
    }

}

/* =========================
   모바일
========================= */

@media (max-width:768px){

    .hero{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .hero-img{
        width:150px;
        max-height:220px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
</head>

<body>

<div id="app">

    <!-- HEADER (기존 유지) -->
    <div id="header"></div>

    <div class="container">

        <!-- HERO (최신호) -->
        <div class="hero">

            <div class="hero-text">

                <div class="section-title">
                    최신호
                </div>

                <div class="hero-title">
                    2026년 5월호
                </div>

                <div class="hero-desc">
                    월간서오 최신호입니다.<br>
                    전자잡지 형식으로 구성된 e뷰어 서비스입니다.
                </div>

                <button class="hero-btn"
                onclick="location.href='202605.html'">
                    최신호 보기
                </button>

            </div>

            <!-- 표지 -->
            <img class="hero-img"
            src="https://drive.google.com/thumbnail?id=1hk7NpBIfWI06E5XDO2oZi5J0ZSnydCk5&sz=w1000">

        </div>

        <!-- 아카이브 -->

        <div class="section">

            <div class="section-link"
            onclick="location.href='2605more.html'">
                2026년 월간 서오 &gt;
            </div>

            <div class="grid">

                <div class="card"
                onclick="location.href='202605.html'">

                    <img src="https://drive.google.com/thumbnail?id=1hk7NpBIfWI06E5XDO2oZi5J0ZSnydCk5&sz=w1000">

                    <div class="card-body">
                        <div class="card-title">2026년 5월호</div>
                        <div class="card-desc">최신 발행본</div>
                    </div>

                </div>

                <div class="card"
                onclick="location.href='202606.html'">

                    <img src="https://drive.google.com/thumbnail?id=1OSbIGt3ZwVDYecxrVhHrB_v8R-oVirsd&sz=w1000">

                    <div class="card-body">
                        <div class="card-title">2026년 6월호</div>
                        <div class="card-desc">발행 예정</div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- FOOTER (기존 유지) -->
    <footer>
        <div id="footer"></div>
    </footer>

</div>

<!-- header/footer 불러오기 -->
<script>

fetch("components/header.html")
.then(r => r.text())
.then(d => document.getElementById("header").innerHTML = d);

fetch("components/footer.html")
.then(r => r.text())
.then(d => document.getElementById("footer").innerHTML = d);

</script>

</body>
</html>
