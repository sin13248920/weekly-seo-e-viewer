<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월간서오 e뷰어</title>

<style>
html, body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #fff;
  color: #111;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 공통 */
.section {
  padding: 30px 20px;
}

.section-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 15px;
}

/* =========================
   최신호
========================= */
.latest-box {
  background: #87ceeb;
  border-radius: 12px;
  padding: 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.latest-info {
  flex: 1;
  text-align: center;
}

.latest-info h2 {
  margin: 0;
  font-size: 26px;
}

.latest-info p {
  margin: 12px 0 20px;
}

.latest-info button {
  padding: 10px 18px;
  border: none;
  border-radius: 6px;
  background: white;
  cursor: pointer;
}

.latest-info button:hover {
  background: #ddd;
}

.latest-cover {
  width: 150px;
  height: 210px;
  object-fit: cover;
  border-radius: 8px;
}

/* =========================
   리스트
========================= */
.list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.more {
  font-size: 14px;
  cursor: pointer;
}

.list {
  display: flex;
  gap: 22px;
  margin-top: 15px;
  overflow-x: auto;
  padding-bottom: 10px;
  scroll-snap-type: x mandatory;
}

.list::-webkit-scrollbar {
  height: 6px;
}
.list::-webkit-scrollbar-thumb {
  background: #ccc;
  border-radius: 10px;
}

/* 카드 */
.item {
  min-width: 170px; /* 기본 */
  flex-shrink: 0;
  cursor: pointer;
  scroll-snap-align: start;
}

.thumb {
  width: 100%;
  height: 230px;
  object-fit: cover;
  border-radius: 10px;
}

.item p {
  text-align: center;
  margin-top: 8px;
  font-size: 14px;
}

/* =========================
   PC (적당히 크게)
========================= */
@media (min-width: 1024px) {

  .item {
    min-width: 230px;
  }

  .thumb {
    height: 310px;
  }

  .item p {
    font-size: 16px;
  }

}

/* =========================
   모바일
========================= */
@media (max-width: 768px) {

  .latest-info h2 {
    font-size: 22px;
  }

  .latest-cover {
    width: 110px;
    height: 150px;
  }

  .item {
    min-width: 140px;
  }

  .thumb {
    height: 180px;
  }

}

/* =========================
b
========================= */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);

  display: flex;
  justify-content: center;
  align-items: center;

  z-index: 9999;
}

.popup-box {
  width: 90%;
  max-width: 400px;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;

  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.popup-box img {
  width: 100%;
  display: block;
}

.popup-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 10px 12px;
  font-size: 13px;
}

.popup-actions button {
  padding: 6px 12px;
  border: none;
  background: #333;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

@media (max-width: 480px) {
  .popup-box {
    max-width: 90%;
  }
}

/* =========================
a
========================= */
.notice {
  position: fixed;

  right: 20px;
  bottom: 20px;
  top: auto;

  width: auto;
  max-width: 420px;

  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);

  overflow: hidden;
  z-index: 1000;

  animation: fadeIn 0.4s ease;
}

.notice-header {
  color: white;
  font-weight: bold;
  padding: 10px 14px;
  font-size: 14px;

  background: linear-gradient(
    270deg,
    #ff0000,
    #ff7a00,
    #ffd400,
    #4dff00,
    #00d4ff,
    #004cff,
    #7a00ff,
    #ff00c8,
    #ff0000
  );

  background-size: 2000% 200%;
  animation: rainbowFlow 4s linear infinite;
}

@keyframes rainbowFlow {
  0% {
    background-position: 0% 50%;
  }
  100% {
    background-position: 100% 50%;
  }
}

/* 애니메이션 */
@keyframes rainbowFlow {
  0% {
    background-position: 0% 50%;
  }
  100% {
    background-position: 100% 50%;
  }
}

.notice-body {
  padding: 14px;
}

.notice-title {
  font-size: 18px;
  margin: 0 0 8px 0;
  font-weight: bold;
}

.notice-text {
  font-size: 13px;
  color: #555;
  margin-bottom: 12px;
  line-height: 1.4;
}

.notice-images {
  width: 100%;
}

.notice-images img {
  width: 100%;
  height: auto;
  object-fit: contain;
  border-radius: 10px;
  display: block;
}

.notice-images img:hover {
  transform: scale(1.05);
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 📱 모바일 대응 */
@media (max-width: 768px) {
  .notice {
    position: static;
    width: 90%;
    margin: 10px auto;
  }

  .notice-images {
    justify-content: center;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <div id="header"></div>

  <div class="content">

    <!-- 최신호 -->
    <div class="section">
      <div class="section-title">최신호</div>

      <div class="latest-box">
        <div class="latest-info">
          <h2>해킹범의 메시지^^</h2>
          <p>사이트 복구 방법 :D</p>
          <button onclick="location.href='hm.html'">복구하러 가기</button>
        </div>

        <img class="latest-cover"
        src="components/th.jpg">
      </div>
    </div>

    <!-- 리스트 -->
    <div class="section">

      <div class="list-header">
        <div class="section-title">2026년 월간서오</div>
        <div class="more" onclick="location.href='2605more.html'">더보기 →</div>
      </div>

      <div class="list">

        <div class="item" onclick="location.href='hm.html'">
          <img class="thumb"
          src="components/th.jpg">
          <p>해킹범의 메시지^^</p>
        </div>

        <div class="item" onclick="location.href='202605.html'">
          <img class="thumb"
          src="https://drive.google.com/thumbnail?id=1hk7NpBIfWI06E5XDO2oZi5J0ZSnydCk5&sz=w1000">
          <p>2026년 5월호</p>
        </div>

        <div class="item" onclick="location.href='202606.html'">
          <img class="thumb"
          src="https://drive.google.com/thumbnail?id=1OSbIGt3ZwVDYecxrVhHrB_v8R-oVirsd&sz=w1000">
          <p>2026년 6월호</p>
        </div>

      </div>

    </div>

    <div class="notice">
      <div class="notice-header">
        📢 공지사항
      </div>

      <div class="notice-body">
        <h2 class="notice-title">이 사이트는 해킹당했습니다!</h2>
        <p class="notice-text">
          안녕하"씹시오"! 해커입니다! 이사이트는 이제 제껍니다.<br>
          사이트가 왜해킹당했냐고요? 이유는 아래 사진과 같습니다!<br>
          개빡치게 공지도 무지개뾰료롱~★
        </p>

        <div class="notice-images">
          <img src="components/replace.png" alt="공지 이미지">
        </div>
      </div>
    </div>

  </div>

  <!-- 팝업 -->
<div id="popup" class="popup">
  <div class="popup-box">

    <img src="components/local.png">

    <div class="popup-actions">
      <label>
        <input type="checkbox" id="todayClose">
        18세 이상입니다.
      </label>

      <button onclick="closePopup()">확인</button>
    </div>

  </div>
</div>

  <!-- FOOTER -->
  <div id="footer"></div>

</div>

<script>

const popupKey = "popupHide";

window.addEventListener("load", () => {
  const saved = localStorage.getItem(popupKey);

  if (saved) {
    const now = new Date().getTime();

    if (now < saved) {
      document.getElementById("popup").style.display = "none";
    } else {
      localStorage.removeItem(popupKey);
    }
  }
});

window.onkeydown = function() {
    var keycode = event.keyCode;
    if (keycode == 18) {
        localStorage.removeItem(popupKey);
    }
}

function closePopup() {
  const checkbox = document.getElementById("todayClose");

  if (checkbox.checked) {
    const now = new Date().getTime();
    const tomorrow = now + (24 * 60 * 60 * 1000);

    localStorage.setItem(popupKey, tomorrow);
  }

  document.getElementById("popup").style.display = "none";
}

fetch("components/header.html")
  .then(r => r.text())
  .then(d => document.getElementById("header").innerHTML = d);

fetch("components/footer.html")
  .then(r => r.text())
  .then(d => document.getElementById("footer").innerHTML = d);
</script>

</body>
</html>
