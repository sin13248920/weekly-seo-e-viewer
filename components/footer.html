        <p>대표번호 : 02-1234-5678 | 02-0987-6543 | 02-0987-4321</p>
        <p>FAX : 02-1234-0987</p>
      </div>
    </div>

    <!-- RIGHT (Family Site) -->
    <div class="family-wrap">

      <button class="family-btn" type="button" onclick="toggleFamily(this)">
        FAMILY SITE ▼
      </button>

      <div class="family-list">
        <a href="https://sin13248920.github.io/Seo-Architecture/" target="_blank">

<style>
.footer {
  width: 100%;
  background: #f2f4f7;
  border-top: 2px solid #c9ced6;
  font-family: "Malgun Gothic", Arial, sans-serif;
}

.footer-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 22px 18px;

  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

/* LEFT */
.footer-left {
  text-align: left;
}

.footer-logo {
  height: 24px;
  margin-bottom: 10px;
  opacity: 0.9;
}

.footer-text p {
  margin: 3px 0;
  font-size: 11px;
  color: #555;
  letter-spacing: -0.2px;
  line-height: 1.4;
}

/* RIGHT */
.family-wrap {
  position: relative;
}

/* 버튼 (2015 느낌) */
.family-btn {
  background: #e6e9ee;
  border: 1px solid #b7bec8;
  padding: 6px 10px;
  font-size: 11px;
  color: #333;
  cursor: pointer;
}

/* 드롭다운 */
.family-list {
  display: none;
  position: absolute;
  right: 0;
  top: 32px;

  width: 140px;
  background: #fff;
  border: 1px solid #b7bec8;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  z-index: 100;
}

/* 열림 상태 */
.family-list.show {
  display: block;
}

/* 링크 */
.family-list a {
  display: block;
  padding: 7px 10px;
  font-size: 11px;
  color: #333;
  text-decoration: none;
  border-bottom: 1px solid #eee;
}

.family-list a:last-child {
  border-bottom: none;
}

.family-list a:hover {
  background: #f0f2f5;
}
</style>

<script>
/* 안전한 토글 (ID 없음 → 충돌 방지) */
function toggleFamily(btn) {
  const wrap = btn.parentElement;
  const list = wrap.querySelector(".family-list");

  list.classList.toggle("show");
}

/* 바깥 클릭 시 전체 닫기 */
document.addEventListener("click", function () {
  document.querySelectorAll(".family-list").forEach(el => {
    el.classList.remove("show");
  });
});
</script>
