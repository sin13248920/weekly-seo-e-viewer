<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 뷰어</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f4f4f4;
}

/*헤더 및 푸터*/
fetch("components/header.html")
  .then(r => r.text())
  .then(d => header.innerHTML = d);

fetch("components/footer.html")
  .then(r => r.text())
  .then(d => footer.innerHTML = d);

/* 전체 가운데 */
.viewer-wrapper {
  display: flex;
  justify-content: center;
  padding: 20px;
}

/* PDF 박스 */
.viewer-card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  max-width: 1100px;
  width: 100%;
  position: relative;
}

/* PDF 영역 */
.page-container {
  display: flex;
  justify-content: center;
  gap: 10px;
  transform-origin: center;
  touch-action: none;
}

canvas {
  width: 100%;
  max-width: 48%;
  background: white;
  border-radius: 8px;
}

/* 컨트롤 (항상 PDF 위) */
.controls {
  text-align: center;
  margin-top: 12px;
  position: relative;
  z-index: 10;
}

button {
  margin: 5px;
  padding: 8px 14px;
  border: none;
  background: #eee;
  border-radius: 6px;
  cursor: pointer;
}

/* 줌 버튼 영역 */
#zoomControls {
  margin-top: 10px;
  display: none;
}

/* 🔥 로딩 (PDF 영역만 덮음) */
#loading {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 18px;
  z-index: 999;
}

/* 로딩 중 클릭 막기 */
.loading-block {
  pointer-events: none;
}

/* 모바일 */
@media (max-width: 768px) {
  .page-container {
    flex-direction: column;
  }
  canvas {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<div class="viewer-wrapper">
  <div class="viewer-card loading-block" id="viewerCard">

    <div id="loading">PDF 로딩중...</div>

    <div class="page-container" id="pageContainer">
      <canvas id="leftCanvas"></canvas>
      <canvas id="rightCanvas"></canvas>
    </div>

    <div class="controls">

      <div id="navButtons">
        <button onclick="prevPage()">◀ 이전</button>
        <span id="pageInfo"></span>
        <button onclick="nextPage()">다음 ▶</button>
      </div>

      <button id="zoomBtn" onclick="enableZoom()">🔍 돋보기</button>
      <button id="resetBtn" onclick="disableZoom()" style="display:none;">❌ 종료</button>

      <div id="zoomControls">
        <button onclick="zoomIn()">➕</button>
        <button onclick="zoomOut()">➖</button>
      </div>

    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const url = "https://raw.githubusercontent.com/sin13248920/weekly-seo-viewer/main/test01.pdf";

let pdfDoc;
let page = 1;
let zoomMode = false;

let scale = 1;
let x = 0, y = 0;

/* 요소 */
const card = document.getElementById("viewerCard");
const loading = document.getElementById("loading");
const container = document.getElementById("pageContainer");

/* PDF 로드 */
pdfjsLib.getDocument(url).promise.then(pdf => {
  pdfDoc = pdf;
  loading.style.display = "none";
  card.classList.remove("loading-block");
  render();
});

/* 렌더 */
function render() {
  if (window.innerWidth < 768) {
    renderOne(page);
  } else {
    renderTwo(page, page + 1);
  }
}

function renderOne(n) {
  rightCanvas.style.display = "none";
  draw(n, leftCanvas);
  pageInfo.textContent = `${n} / ${pdfDoc.numPages}`;
}

function renderTwo(l, r) {
  rightCanvas.style.display = "block";
  draw(l, leftCanvas);
  if (r <= pdfDoc.numPages) draw(r, rightCanvas);
  pageInfo.textContent = `${l}-${Math.min(r, pdfDoc.numPages)} / ${pdfDoc.numPages}`;
}

function draw(n, canvas) {
  pdfDoc.getPage(n).then(page => {
    const ctx = canvas.getContext("2d");
    const view = page.getViewport({ scale: 1.5 });

    canvas.width = view.width;
    canvas.height = view.height;

    page.render({ canvasContext: ctx, viewport: view });
  });
}

/* 페이지 */
function nextPage() {
  if (zoomMode) return;

  if (window.innerWidth < 768) page++;
  else page = (page === 1) ? 2 : page + 2;

  if (page > pdfDoc.numPages) return;
  render();
}

function prevPage() {
  if (zoomMode) return;

  if (window.innerWidth < 768) page--;
  else page = (page === 2) ? 1 : page - 2;

  if (page < 1) page = 1;
  render();
}

/* 돋보기 */
function enableZoom() {
  zoomMode = true;
  zoomBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
  navButtons.style.display = "none";
  zoomControls.style.display = "block";
}

function disableZoom() {
  zoomMode = false;
  zoomBtn.style.display = "inline-block";
  resetBtn.style.display = "none";
  navButtons.style.display = "block";
  zoomControls.style.display = "none";

  scale = 1;
  x = 0;
  y = 0;
  update();
}

/* 줌 */
function zoomIn() {
  if (!zoomMode) return;
  scale = Math.min(scale + 0.2, 3);
  update();
}

function zoomOut() {
  if (!zoomMode) return;
  scale = Math.max(scale - 0.2, 1);
  update();
}

function update() {
  container.style.transform =
    `translate(${x}px, ${y}px) scale(${scale})`;
}

/* 드래그 */
let down = false;
let sx = 0, sy = 0;

container.addEventListener("mousedown", e => {
  if (!zoomMode) return;
  down = true;
  sx = e.clientX - x;
  sy = e.clientY - y;
});

window.addEventListener("mousemove", e => {
  if (!zoomMode || !down) return;
  x = e.clientX - sx;
  y = e.clientY - sy;
  update();
});

window.addEventListener("mouseup", () => down = false);

/* 🔥 모바일 pinch (수정 핵심) */
let startDist = null;
let startScale = 1;
let drag = false;
let tx = 0, ty = 0;

container.addEventListener("touchstart", e => {
  if (!zoomMode) return;

  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    startDist = Math.sqrt(dx*dx + dy*dy);
    startScale = scale;
  }

  if (e.touches.length === 1) {
    drag = true;
    tx = e.touches[0].clientX - x;
    ty = e.touches[0].clientY - y;
  }
});

container.addEventListener("touchmove", e => {
  if (!zoomMode) return;

  if (e.touches.length === 2 && startDist) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);

    scale = Math.max(1, Math.min(3, startScale * (dist / startDist)));
    update();
  }

  if (e.touches.length === 1 && drag) {
    x = e.touches[0].clientX - tx;
    y = e.touches[0].clientY - ty;
    update();
  }
});

container.addEventListener("touchend", () => {
  drag = false;
  startDist = null;
});

/* resize */
window.addEventListener("resize", render);
</script>

</body>
</html>
