<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 뷰어</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f4f4f4;
}

/* layout */
.viewer-wrapper {
  display: flex;
  justify-content: center;
  padding: 20px;
}

.viewer-card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  max-width: 1100px;
  width: 100%;
  position: relative;
}

/* PDF */
.page-container {
  display: flex;
  justify-content: center;
  gap: 10px;
  touch-action: none;
  transform-origin: center;
}

canvas {
  width: 100%;
  max-width: 48%;
  background: white;
  border-radius: 8px;
}

/* controls */
.controls {
  text-align: center;
  margin-top: 12px;
  position: relative;
  z-index: 10;
}

button {
  margin: 5px;
  padding: 8px 14px;
  border: none;
  background: #eee;
  border-radius: 6px;
}

/* loading only PDF area */
#loading {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  z-index: 999;
}

/* disable interaction while loading */
.loading-block {
  pointer-events: none;
}

/* mobile */
@media (max-width: 768px) {
  .page-container {
    flex-direction: column;
  }
  canvas {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<div id="header"></div>

<div class="viewer-wrapper">
  <div class="viewer-card loading-block" id="viewerCard">

    <div id="loading">PDF 로딩중...</div>

    <div class="page-container" id="pageContainer">
      <canvas id="leftCanvas"></canvas>
      <canvas id="rightCanvas"></canvas>
    </div>

    <div class="controls">
      <button onclick="prevPage()">◀ 이전</button>
      <span id="pageInfo"></span>
      <button onclick="nextPage()">다음 ▶</button>

      <br>

      <button onclick="enableZoom()">🔍 돋보기</button>
      <button onclick="disableZoom()" id="resetBtn" style="display:none;">❌ 종료</button>

      <div id="zoomControls" style="display:none;">
        <button onclick="zoomIn()">➕</button>
        <button onclick="zoomOut()">➖</button>
      </div>
    </div>

  </div>
</div>

<div id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
/* header / footer 복구 */
fetch("components/header.html").then(r=>r.text()).then(d=>header.innerHTML=d);
fetch("components/footer.html").then(r=>r.text()).then(d=>footer.innerHTML=d);

const url = "https://raw.githubusercontent.com/sin13248920/weekly-seo-viewer/main/test01.pdf";

let pdfDoc;
let page = 1;
let zoomMode = false;
let rendered = new Set();

/* zoom state */
let scale = 1;
let x = 0, y = 0;

/* elements */
const card = document.getElementById("viewerCard");
const loading = document.getElementById("loading");

/* PDF load */
pdfjsLib.getDocument(url).promise.then(pdf => {
  pdfDoc = pdf;

  loading.style.display = "none";
  card.classList.remove("loading-block");

  renderPage(page); // 🔥 첫 페이지만 즉시 로딩
});

/* 🔥 페이지 단위 lazy render */
function renderPage(n) {
  if (!pdfDoc || n < 1 || n > pdfDoc.numPages) return;
  if (rendered.has(n)) return;

  pdfDoc.getPage(n).then(p => {
    const canvas = (n % 2 === 1) ? leftCanvas : rightCanvas;
    const ctx = canvas.getContext("2d");

    const view = p.getViewport({ scale: 1.5 });

    canvas.width = view.width;
    canvas.height = view.height;

    p.render({ canvasContext: ctx, viewport: view });

    rendered.add(n);
    updateInfo();
  });
}

/* render view */
function updateInfo() {
  pageInfo.textContent = `${page} / ${pdfDoc.numPages}`;
}

/* navigation */
function nextPage() {
  if (zoomMode) return;

  page += 2;
  renderPage(page);
  renderPage(page + 1);
}

function prevPage() {
  if (zoomMode) return;

  page = Math.max(1, page - 2);
  renderPage(page);
  renderPage(page + 1);
}

/* zoom */
function enableZoom() {
  zoomMode = true;
  zoomControls.style.display = "block";
  resetBtn.style.display = "inline-block";
}

function disableZoom() {
  zoomMode = false;
  zoomControls.style.display = "none";
  resetBtn.style.display = "none";

  scale = 1;
  x = 0;
  y = 0;
  update();
}

function zoomIn() {
  scale = Math.min(scale + 0.2, 3);
  update();
}

function zoomOut() {
  scale = Math.max(scale - 0.2, 1);
  update();
}

function update() {
  pageContainer.style.transform =
    `translate(${x}px, ${y}px) scale(${scale})`;
}

/* drag */
let down = false, sx = 0, sy = 0;

pageContainer.addEventListener("mousedown", e => {
  if (!zoomMode) return;
  down = true;
  sx = e.clientX - x;
  sy = e.clientY - y;
});

window.addEventListener("mousemove", e => {
  if (!down || !zoomMode) return;
  x = e.clientX - sx;
  y = e.clientY - sy;
  update();
});

window.addEventListener("mouseup", () => down = false);
</script>

</body>
</html>
